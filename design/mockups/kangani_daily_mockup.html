<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kangani — Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E4; --card:#F3E8D3; --ink:#33291F; --ink-soft:#6B5D4C;
    --rule:#D9C9AC; --rose:#B5646B; --sage:#748264; --blue:#5E7A93; --mustard:#C79A44;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    width:1080px; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif; padding:64px 56px 80px;
    background-image: radial-gradient(circle at 1px 1px, rgba(51,41,31,0.035) 1px, transparent 0);
    background-size: 14px 14px;
  }
  .head{display:flex; align-items:baseline; gap:20px; margin-bottom:6px;}
  .head h1{font-family:'Caveat',cursive; font-weight:700; font-size:80px; line-height:1;}
  .pill{background:var(--mustard); color:#3E2E0D; font-size:16px; font-weight:600; padding:6px 18px;
        border-radius:999px; align-self:center;}
  .sub{font-size:20px; color:var(--ink-soft); margin-bottom:40px;}
  .timeline{position:relative; padding-left:90px;}
  .spine{position:absolute; left:70px; top:6px; bottom:6px; width:2px; background:var(--rule);}
  .slot{position:relative; margin-bottom:26px;}
  .hour{position:absolute; left:-90px; top:0; width:64px; text-align:right;
        font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink-soft);}
  .tick{position:absolute; left:66px; top:6px; width:10px; height:10px; border-radius:50%; background:var(--paper);
        border:2px solid var(--ink-soft);}
  .card{background:var(--card); border-radius:14px; padding:18px 22px; margin-left:10px;}
  .card .strip{width:100%; height:4px; border-radius:4px; margin-bottom:12px;}
  .strip.rose{background:var(--rose);} .strip.blue{background:var(--blue);}
  .card b{font-size:19px; font-weight:600;}
  .card .meta{font-size:14px; color:var(--ink-soft); margin-top:4px;}
  .also{margin-top:56px; border-top:1px solid var(--rule); padding-top:28px;}
  .also h2{font-family:'Caveat',cursive; font-size:34px; font-weight:700; margin-bottom:16px;}
  .item{display:flex; align-items:center; gap:14px; padding:9px 0; font-size:16px;}
  .ring{width:16px; height:16px; border-radius:50%; border:2px solid var(--ink-soft); flex-shrink:0;}
  .item .t{color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:14px; width:70px;}
</style>
</head>
<body>

<div class="head">
  <h1>Wednesday</h1>
  <span class="pill">Week 1</span>
</div>
<p class="sub">12 August</p>

<div class="timeline">
  <div class="spine"></div>

  <div class="slot" style="margin-top:0;">
    <span class="hour">09:30</span>
    <span class="tick"></span>
    <div class="card"><div class="strip rose"></div><b>SC2001 Tutorial</b><div class="meta">SCE1 &middot; 09:30&ndash;10:20</div></div>
  </div>

  <div class="slot">
    <span class="hour">10:30</span>
    <span class="tick"></span>
    <div class="card"><div class="strip blue"></div><b>SC3000 Lab</b><div class="meta">TEL1 (online) &middot; 10:30&ndash;12:20</div></div>
  </div>

  <div class="slot">
    <span class="hour">13:30</span>
    <span class="tick"></span>
    <div class="card"><div class="strip rose"></div><b>BU5201 Seminar</b><div class="meta">S4-SR22 &middot; 13:30&ndash;16:20</div></div>
  </div>

  <div class="slot">
    <span class="hour">16:30</span>
    <span class="tick"></span>
    <div class="card"><div class="strip rose"></div><b>SC2001 Lecture</b><div class="meta">LKC-LT &middot; 16:30&ndash;17:20</div></div>
  </div>
</div>

<div class="also">
  <h2>Also today</h2>
  <div class="item"><span class="ring"></span><span>Finish AI assignment 1</span></div>
  <div class="item"><span class="t">18:00</span><span>&#9679; Submit BU5201 case study</span></div>
</div>

</body>
</html>
