# Kangani evaluation prompt suite.
#
# SCHEMA
#   id              stable join key across repeat runs. The analysis groups on
#                   this, not on message text.
#   message         exactly what gets sent, verbatim, including casing and
#                   punctuation -- both matter to dispatch_text_shortcut.
#   expected_tool   the DECISIVE tool for this prompt, or null for a prompt
#                   that should never reach Claude. Prerequisite lookups are
#                   not listed: the system prompt mandates list_topics before
#                   most mutations and query_tasks before a delete, so those
#                   fire too. Dispatch accuracy is "did expected_tool appear in
#                   this turn's tool_calls", not "was it the only one".
#   expected_route  one of answer | button_route | intercepted | ceiling |
#                   truncated | error. Describes the DEFAULT config. Under the
#                   MAX_TOOL_ITERATIONS=2 ceiling config, multi-tool prompts
#                   are expected to come back 'ceiling' instead, and that
#                   divergence is the measurement, not a failure.
#   states          fixtures this prompt is meaningful against. A delete prompt
#                   has no valid target in the empty DB, so asserting a tool
#                   call there would be asserting a hallucination.
#   notes           why this entry exists. Written for whoever reads the
#                   results, not for whoever writes the runner.
#
# Prompts target the `full` fixture's actual contents -- CZ3005/CZ3001/CZ3004,
# the seeded tasks, the three near-duplicate note pairs. A prompt naming data
# that isn't there measures nothing.

# ---------------------------------------------------------------------------
# A. One entry per registered tool (31)
# ---------------------------------------------------------------------------

