  message: "  tasks  "
  expected_tool: null
  expected_route: button_route
  states: [full, empty, single, conflicting]
  notes: "Leading and trailing whitespace stripped. Realistic on mobile keyboards."

- id: norm_today_exclamation
  message: "Today!"
  expected_tool: null
  expected_route: button_route
  states: [full, empty, single, conflicting]
  notes: "Case plus punctuation together."

- id: norm_help_period
  message: "help."
  expected_tool: null
  expected_route: button_route
  states: [full, empty, single, conflicting]
  notes: "Trailing period stripped."

- id: norm_tasks_double_punct
  message: "tasks??"
  expected_tool: null
  expected_route: button_route
  states: [full, empty, single, conflicting]
  notes: >-
    rstrip removes ALL trailing chars in the set, not just one, so this should
    still match. If it falls through, the router is using a single-char strip.

