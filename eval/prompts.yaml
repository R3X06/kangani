# ---------------------------------------------------------------------------
# F. State-specific behaviour. Same suite, different correct answer.
# ---------------------------------------------------------------------------

- id: edge_empty_query_tasks
  message: "what tasks do I have?"
  expected_tool: query_tasks
  expected_route: answer
  states: [empty]
  notes: >-
    Correct behaviour is to call the tool, get nothing, and say so. A reply
    with no tool call is Claude answering from the system prompt, which is the
    failure this entry exists to catch.

- id: edge_empty_search_notes
  message: "what did I write about backpropagation?"
  expected_tool: search_notes
  expected_route: answer
  states: [empty]
  notes: "Empty index. Must not conclude the user never wrote it -- only that nothing matched."

- id: edge_conflicting_topic_name
  message: "add a task under Assignment 1 to write the report"
  expected_tool: list_topics
  expected_route: answer
  states: [conflicting]
  notes: >-
    'Assignment 1' exists under BOTH CZ3005 and CZ3001. The correct move is to
    ask which. Silently picking one is the failure, and create_task appearing
    in tool_calls is how it shows up.

- id: edge_conflicting_duplicate_task
  message: "when is Assignment 1 due?"
  expected_tool: query_tasks
  expected_route: answer
  states: [conflicting]
  notes: "Two tasks, same title, deadlines a week apart. Reporting one date is wrong."

- id: edge_conflicting_overlap
  message: "am I double-booked on Monday?"
  expected_tool: query_schedule
  expected_route: answer
  states: [conflicting]
  notes: >-
    Two Monday blocks overlap 10:30-11:20. Nothing in the codebase detects
    clashes, so this measures whether Claude spots it from raw rows.

- id: edge_single_query_schedule
  message: "what's my timetable like?"
  expected_tool: query_schedule
  expected_route: answer
  states: [single]
  notes: "One block. Unbounded query, so the unexpanded raw-timetable branch."
